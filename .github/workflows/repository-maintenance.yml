name: Dependency Submission

on:
  push:
  workflow_dispatch:


permissions:
  actions: read
  contents: write
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}${{ github.ref_name != github.event.repository.default_branch && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref_name != github.event.repository.default_branch }}

jobs:
  maintenance_workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: actions/setup-java@7a6d8a8234af8eb26422e24e3006232cccaa061b # v5.1.0
        name: Setup Java
        with:
          distribution: temurin
          java-version-file: .sdkmanrc
      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@017a9effdb900e5b5b2fddfb590a105619dca3c3 # v4.4.2
        with:
          gradle-version: wrapper
          dependency-graph: generate-and-submit
          # Include only relevant configurations
          dependency-graph-include-configurations: '(implementation|api|compileClasspath|runtimeClasspath)'
        env:
          CODEARTIFACT_AUTH_TOKEN: ${{ secrets.CODEARTIFACT_AUTH_TOKEN }}
          SCHEMAPI_LOGIN: ${{ secrets.SCHEMAPI_LOGIN }}
          SCHEMAPI_PASSWORD: ${{ secrets.SCHEMAPI_PASSWORD }}
